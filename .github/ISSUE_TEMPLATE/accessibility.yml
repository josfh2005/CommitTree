name: Accessibility barrier
description: Something that makes CommitTree hard or impossible to use
labels: [accessibility]
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: Assistive technology or setting
      description: For example VoiceOver, Orca, keyboard only, zoom, high contrast.
  - type: input
    id: env
    attributes:
      label: CommitTree version and operating system
      placeholder: v0.4.0 on macOS 26

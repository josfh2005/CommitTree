name: Feature request
description: Suggest something CommitTree could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet. "When I rebase a long branch I lose track of …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine CommitTree could do it.
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another git client, the command line, a workaround…

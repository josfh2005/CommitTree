name: Bug report
description: Something in CommitTree doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CommitTree version
      description: Shown next to Settings at the bottom of the sidebar.
      placeholder: v0.4.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI provider involved
      description: Only if the problem is in the chat, a commit message or the conflict resolver.
      options:
        - Not AI related
        - Ollama
        - Anthropic
        - OpenAI
  - type: textarea
    id: commands
    attributes:
      label: Git commands or errors
      description: Relevant rows from the Commands panel, or the error message shown. Remove anything private.
      render: text
